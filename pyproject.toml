[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traefik"
version = "1.1.0"
description = "Async client library for the Traefik API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AboveColin", email = "colin@cdevries.dev" }]
keywords = ["traefik", "proxy", "reverse-proxy", "async", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.urls]
Homepage = "https://github.com/AboveColin/traefik"
Issues = "https://github.com/AboveColin/traefik/issues"

[tool.setuptools.packages.find]
include = ["traefik*"]

[tool.setuptools.package-data]
traefik = ["py.typed"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = ["too-many-instance-attributes", "too-many-arguments", "too-few-public-methods"]
